name: Bug Report
description: Create a report to help us improve lzma2.zig
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - muhammad-fiaz
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report for **lzma2.zig**!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: I am experiencing an issue where...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal, reproducible steps or code example to trigger the behavior.
      placeholder: |
        1. Initialize project with lzma2 dependency
        2. Call `lzma2.compress(...)` or `lzma2.decompress(...)`
        3. See unexpected behavior or error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lzma2.zig Version
      description: What version of lzma2.zig are you using?
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: zig_version
    attributes:
      label: Zig Version
      description: What version of Zig are you using?
      placeholder: 0.17.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Codec API / Format
      description: Which part of the library does this issue affect?
      options:
        - Modern LZMA2 One-Shot (lzma2.compress / decompress)
        - Legacy .lzma Container (lzma.compress / decompress)
        - Raw LZMA Stream (lzma.compressRaw / decompressRaw)
        - Streaming Pipelines (compressStream / decompressStream)
        - Reusable Compressor Context (Compressor)
        - Reusable Decompressor Context (Decompressor)
        - Zero-Allocation Buffers (compressInto / decompressInto)
        - Interoperability with XZ / 7-Zip
        - Other
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - FreeBSD
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output / Stack Trace
      description: Please copy and paste any relevant terminal or error output.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Contribution Guidelines
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/muhammad-fiaz/lzma2.zig/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I have searched existing issues and verified this is not a duplicate report
          required: true
