<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- LZMA2 Cyan/Blue Gradient -->
    <linearGradient id="lzma2-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Zig Amber/Orange Gradient -->
    <linearGradient id="zig-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Glow/Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
    <filter id="zig-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Stylized L path -->
  <path d="M 20 16 L 20 48 L 44 48" 
        fill="none" 
        stroke="url(#lzma2-grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- High-speed Zig lightning accent -->
  <path d="M 36 12 L 23 32 L 32 32 L 25 50 L 43 27 L 33 27 Z" 
        fill="url(#zig-grad)" 
        filter="url(#zig-glow)"/>
</svg>